{{- range $key, $val := .Values.deployment }}
{{- if $val.service }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- if $val.use_grpc }}
    konghq.com/protocol : grpcs
    {{- end }}
    {{- if $val.service.timeouts }}
    konghq.com/override: {{ $val.name }}-kingress
    {{- end }}
  labels:
    app: "{{ $val.name }}"
  name: "{{ $val.name }}"
spec:
  type : "{{ $val.service.type |default "ClusterIP"}}"
  ports:
  - port: 80
    protocol: TCP
    targetPort: {{ $val.service.targetPort |default "80" }}
  selector:
    app: "{{ $val.name }}"
---
{{- end }}
{{- end }}